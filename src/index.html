<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Imanuel Chatur</title>
    <meta
      name="description"
      content="Imanuel Chatur, Cyber Security student at Sheridan College. AI security research and security-first web applications."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e12" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Apply the saved theme before Angular boots, so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- IBM Plex, self-hosted (latin subset, copied from @fontsource by angular.json assets).
         font-display: optional + preload = no layout shift from font swapping; relative URLs
         resolve against the base href (/Portfolio2026/ on GitHub Pages). -->
    <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/ibm-plex-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: optional; src: url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: optional; src: url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: optional; src: url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: optional; src: url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: optional; src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: optional; src: url('fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
    </style>

    <!-- Material Symbols, subset to the icons the site uses (names must stay alphabetical).
         Adding an icon? Add its name to icon_names. Loaded without blocking first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward,arrow_upward,close,code,content_copy,dark_mode,error,light_mode,mail,menu,north_east,open_in_new,refresh,work&display=block"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
