<footer>
  <div class="wrap bar mono">
    <span>© {{ year }} Imanuel Chatur</span>
    <nav aria-label="Footer">
      <ul>
        @for (link of links; track link.path) {
          <li><a [routerLink]="link.path">{{ link.label }}</a></li>
        }
        <li><a [href]="social.github" target="_blank" rel="noopener">GitHub</a></li>
        <li><a [href]="social.linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
      </ul>
    </nav>
    <span class="end">Built with Angular · hosted on GitHub Pages</span>
  </div>
</footer>
