name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Sent by the writeups repo on push (see README: "Rebuild when writeups change").
  repository_dispatch:
    types: [content-updated]
  # Daily, so newly tagged `portfolio` repos appear without a push here.
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fetches projects/writeups from GitHub (build time only), builds the content index,
      # builds with base href /Portfolio2026/, and writes per-route HTML + the 404.html fallback.
      # CI=true makes any GitHub fetch error fail the build, so an empty site never ships.
      # The default GITHUB_TOKEN only reads public repos; it is never written to the output.
      - run: npm run build:pages
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check no token leaked into the build
        run: '! grep -rE "ghp_|github_pat_|ghs_" dist/Portfolio2026/browser'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/Portfolio2026/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
